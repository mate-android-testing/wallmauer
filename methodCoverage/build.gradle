plugins {
    id 'java-conventions'
    id 'application'
}

application {
    mainClass.set("de.uni_passau.fim.auermich.instrumentation.methodcoverage.MethodCoverage")
}

tasks.register('customFatJar', Jar) {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': 'de.uni_passau.fim.auermich.instrumentation.methodcoverage.MethodCoverage'
    }

    from(sourceSets.main.output)

    dependsOn configurations.runtimeClasspath

    from {
        configurations.runtimeClasspath
                .filter { it.name.endsWith('jar') }
                .collect { zipTree(it) }
    }
}